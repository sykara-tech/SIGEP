<div class="card">
  <div class="card-header"><h2>Movimentação de Alunos</h2></div>
  <div class="sub-sec">Transferência, troca de turma, efetivação, remanejamento — histórico preservado.</div>
  <div class="form-grid">
    <div><label>Aluno</label><select id="mv_aluno"></select></div>
    <div><label>Operação</label>
      <select id="mv_op">
        <option value="efetivacao">Efetivação (Pendente → Normal)</option>
        <option value="troca">Troca de turma</option>
        <option value="transferencia">Transferência</option>
        <option value="remanejar">Remanejar</option>
      </select>
    </div>
    <div><label>Turma destino</label><select id="mv_destino"></select></div>
  </div>
  <div style="padding:0 16px 16px"><button class="btn btn-aviso" onclick="mover()">Executar</button></div>
</div>
  </main>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
  <script src="sec-common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const u = exigirLogin(["Secretaria", "Gestor", "Coordenacao"]);
      if (!u) return;
      document.getElementById("topo").innerHTML = montarTopo("Movimentação", "Secretaria · Ano 2026");
      document.getElementById("dataTopo").textContent = dataHoje();
      if (typeof aplicarNavSec === "function") aplicarNavSec("sec-movimentacao.html");
      if (typeof initPage === "function") initPage("movimentacao");
    });
  </script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
