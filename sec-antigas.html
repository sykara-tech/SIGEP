<div class="card">

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const u = exigirLogin(["Secretaria", "Gestor", "Coordenacao"]);
      if (!u) return;
      document.getElementById("topo").innerHTML = montarTopo("Turmas Antigas", "Secretaria · Ano 2026");
      document.getElementById("dataTopo").textContent = dataHoje();
      if (typeof aplicarNavSec === "function") aplicarNavSec("sec-antigas.html");
      if (typeof initPage === "function") initPage("antigas");
    });
  </script>

<script>
if ('serviceWorker' in navigator) {
