<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGEP — Diário do Professor</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .acesso-wrap {
      max-width: 560px;
      margin: 24px auto 40px;
      padding: 0 16px;
    }
    .acesso-card {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
      padding: 28px 28px 22px;
    }
    .acesso-card h2 {
      margin: 0 0 6px;
      color: var(--azul-escuro);
      font-size: 20px;
    }
    .acesso-card > .desc {
      font-size: 13px;
      color: #555;
      margin: 0 0 20px;
      line-height: 1.4;
    }
    .acesso-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 14px;
      margin-bottom: 8px;
    }
    .acesso-grid label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #555;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .acesso-grid input,
    .acesso-grid select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--borda);
      border-radius: 6px;
      font-size: 14px;
      background: #fafbfd;
    }
    .acesso-grid input:focus,
    .acesso-grid select:focus {
      outline: none;
      border-color: var(--azul-siap);
      background: #fff;
    }
    .modulos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 18px;
    }
    .mod-card {
      display: block;
      text-decoration: none;
      border: 1.5px solid #d0d8e4;
      border-radius: 10px;
      padding: 14px 16px;
      background: #fff;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, background .15s;
      text-align: left;
      width: 100%;
      font-family: inherit;
    }
    .mod-card:hover {
      border-color: var(--azul-siap);
      box-shadow: 0 3px 12px rgba(26,95,158,.12);
      background: #f7fbff;
    }
    .mod-card h3 {
      margin: 0 0 4px;
      font-size: 15px;
      color: var(--azul-escuro);
      font-weight: 700;
    }
    .mod-card p {
      margin: 0;
      font-size: 12.5px;
      color: #666;
      line-height: 1.35;
    }
    .mod-card .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .tag-notas { background: #e3f2fd; color: #1565c0; }
    .tag-freq { background: #e8f5e9; color: #2e7d32; }
    .tag-plan { background: #fff3e0; color: #e65100; }
    .tag-bloco { background: #f3e5f5; color: #7b1fa2; }
    .acesso-nota {
      margin-top: 16px;
      font-size: 12px;
      color: #888;
      text-align: center;
      line-height: 1.4;
    }
    .ctx-banner {
      background: #eef5fc;
      border: 1px solid #b8c4d4;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }
    .ctx-banner strong { color: var(--azul-escuro); }
    @media (max-width: 520px) {
      .acesso-grid { grid-template-columns: 1fr; }
      .acesso-card { padding: 20px 16px 16px; }
    }
  </style>
</head>
<body>
  <div id="topo"></div>
  <div class="acesso-wrap">
    <div class="acesso-card">
      <h2>Diário do Professor</h2>
      <p class="desc">Selecione a turma e o componente curricular. Em seguida, escolha o módulo de trabalho.</p>

      <div class="ctx-banner" id="ctxBanner">
        <strong>Última seleção:</strong> <span id="ctxTxt"></span>
      </div>

      <div class="acesso-grid">
        <div>
          <label>Ano letivo</label>
          <input id="ano" value="2026" readonly />
        </div>
        <div>
          <label>Bimestre</label>
          <select id="bim">
            <option value="1">1º Bimestre</option>
            <option value="2" selected>2º Bimestre</option>
            <option value="3">3º Bimestre</option>
            <option value="4">4º Bimestre</option>
          </select>
        </div>
        <div>
          <label>Turma</label>
          <select id="turma"></select>
        </div>
        <div>
          <label>Disciplina</label>
          <select id="disc"></select>
        </div>
      </div>

      <div class="modulos">
        <button type="button" class="mod-card" onclick="entrar('notas')">
          <span class="tag tag-notas">Notas</span>
          <h3>Lançamento de notas</h3>
          <p>Métodos de avaliação (60%) e visualização da Prova de Bloco (40%).</p>
        </button>
        <button type="button" class="mod-card" onclick="entrar('frequencia')">
          <span class="tag tag-freq">Frequência</span>
          <h3>Frequência da disciplina</h3>
          <p>Chamada deste componente curricular.</p>
        </button>
        <button type="button" class="mod-card" onclick="entrar('conteudo')">
          <span class="tag tag-plan">Planejamento</span>
          <h3>Planejamento de aulas</h3>
          <p>Registro de conteúdos, metodologias e recursos do bimestre.</p>
        </button>
        <button type="button" class="mod-card" onclick="entrar('bloco')">
          <span class="tag tag-bloco">Bloco</span>
          <h3>Prova de Bloco</h3>
          <p>Lançamento das notas da Prova de Bloco</p>
        </button>
      </div>

      <p class="acesso-nota">
        Escolha um modulo.
      </p>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
  <script>
    let user, turmasMap = {}, discMap = {}, prof = null;

    function lerCtx() {
      try { return JSON.parse(sessionStorage.getItem("siap_diario_ctx") || "{}"); } catch { return {}; }
    }

    function salvarCtx() {
      const turma = document.getElementById("turma").value;
      const disc = document.getElementById("disc").value;
      const discNome = document.getElementById("disc").selectedOptions[0]?.dataset.nome || disc;
      const bim = document.getElementById("bim").value;
      const ano = document.getElementById("ano").value;
      if (!turma || !disc) {
        toast("Selecione turma e disciplina.", "erro");
        return null;
      }
      const ctx = { ano, turma, discId: disc, discNome, bim };
      sessionStorage.setItem("siap_diario_ctx", JSON.stringify(ctx));
      return ctx;
    }

    function entrar(modulo) {
      if (!salvarCtx()) return;
      mostrarCarregando("Abrindo módulo...");
      if (modulo === "bloco") {
        location.href = "bloco.html";
        return;
      }
      sessionStorage.setItem("siap_diario_aba", modulo);
      location.href = "diario.html";
    }

    async function init() {
      user = exigirLogin(["Professor", "Gestor", "Coordenacao", "Secretaria"]);
      if (!user) return;
      document.getElementById("topo").innerHTML = montarTopo("Diário do Professor", "Seleção de turma e disciplina");
      document.getElementById("dataTopo").textContent = dataHoje();

      mostrarCarregando("Carregando turmas e disciplinas...");
      try {
        turmasMap = (await fbGet(PATH.turmas)) || {};
        discMap = (await fbGet(PATH.disciplinas)) || {};
        if (user.perfil === "Professor" && user.profId) {
          prof = await fbGet(PATH.professores + "/" + user.profId);
        }
      } catch (e) {
        toast("Não foi possível carregar os dados. Tente novamente.", "erro");
      }
      ocultarCarregando();

      let tOpts = Object.values(turmasMap);
      let dOpts = Object.values(discMap);
      let vinculosProfessor = [];
      if (user.perfil === "Professor") {
        try {
          const vinculos = (await fbGet(PATH.vinculos)) || {};
          vinculosProfessor = Object.values(vinculos).filter(v => v.professorId === user.profId);
        } catch(e) {}

        if (vinculosProfessor.length) {
          const mt = [...new Set(vinculosProfessor.map(v => v.turmaId))];
          const md = [...new Set(vinculosProfessor.map(v => v.disciplinaId))];
          tOpts = tOpts.filter(t => mt.includes(t.id));
          dOpts = dOpts.filter(d => md.includes(d.id));
        } else {
          const mt = (user.turmas && user.turmas.length) ? user.turmas : (prof && prof.turmas) || [];
          const md = (user.disciplinas && user.disciplinas.length) ? user.disciplinas : (prof && prof.disciplinas) || [];
          if (mt.length) tOpts = tOpts.filter(t => mt.includes(t.id));
          if (md.length) dOpts = dOpts.filter(d => md.includes(d.id));
        }
      }

      const turmaEl = document.getElementById("turma");
      const discEl = document.getElementById("disc");
      turmaEl.innerHTML = tOpts.map(t =>
        `<option value="${t.id}">${t.nome} (${t.id})</option>`).join("") || "<option value=''>Sem turmas vinculadas</option>";

      function atualizarDisciplinasInicio() {
        if (user.perfil !== "Professor" || !vinculosProfessor.length) return;
        const turmaId = turmaEl.value;
        const ids = [...new Set(vinculosProfessor.filter(v => v.turmaId === turmaId).map(v => v.disciplinaId))];
        const atual = discEl.value;
        discEl.innerHTML = ids.map(id => {
          const d = discMap[id];
          return d ? `<option value="${d.id}" data-nome="${d.nome}">${d.codigo || d.id} — ${d.nome}</option>` : "";
        }).join("") || "<option value=''>Nenhuma disciplina vinculada a esta turma</option>";
        if (ids.includes(atual)) discEl.value = atual;
      }

      discEl.innerHTML = dOpts.map(d =>
        `<option value="${d.id}" data-nome="${d.nome}">${d.codigo || d.id} — ${d.nome}</option>`).join("") || "<option value=''>Sem disciplinas</option>";
      turmaEl.addEventListener("change", atualizarDisciplinasInicio);
      atualizarDisciplinasInicio();

      const ctx = lerCtx();
      if (ctx.turma && ctx.discId) {
        const selT = document.getElementById("turma");
        const selD = document.getElementById("disc");
        const selB = document.getElementById("bim");
        if ([...selT.options].some(o => o.value === ctx.turma)) selT.value = ctx.turma;
        if ([...selD.options].some(o => o.value === ctx.discId)) selD.value = ctx.discId;
        if (ctx.bim) selB.value = ctx.bim;
        const tNome = (turmasMap[ctx.turma] || {}).nome || ctx.turma;
        document.getElementById("ctxTxt").textContent =
          `${tNome} · ${ctx.discNome || ctx.discId} · ${ctx.bim || "2"}º bim · ${ctx.ano || "2026"}`;
        document.getElementById("ctxBanner").style.display = "block";
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
